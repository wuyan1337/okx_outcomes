<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shinori // Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0f;font-family:'Inter',sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center}
.card{background:rgba(12,10,18,0.75);backdrop-filter:blur(24px);border:1px solid rgba(167,139,250,0.12);border-radius:20px;padding:48px;width:380px;box-shadow:0 24px 80px rgba(0,0,0,0.6)}
.card h1{font-size:22px;font-weight:700;color:#ece8f4;margin-bottom:6px;text-align:center}
.card .sub{font-size:12px;color:#5c5270;letter-spacing:1.5px;margin-bottom:36px;text-align:center}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:#9b8fb8;margin-bottom:8px;font-weight:500}
.field input{width:100%;background:rgba(10,10,15,0.9);border:1px solid rgba(46,40,64,0.8);color:#ece8f4;font-family:'Inter',sans-serif;font-size:15px;padding:14px 16px;outline:none;border-radius:12px;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,0.12)}
.btn{width:100%;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;padding:14px;border:none;cursor:pointer;border-radius:12px;margin-top:12px;transition:transform .15s,box-shadow .15s;letter-spacing:0.5px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(167,139,250,0.35)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.err{color:#f87171;font-size:12px;margin-top:14px;display:none;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wrap">
<div class="card">
<h1>Shinori</h1>
<div class="sub">PREDICTION ENGINE</div>
<div class="field"><label>Username</label><input type="text" id="u" autocomplete="username" autofocus></div>
<div class="field"><label>Password</label><input type="password" id="p" autocomplete="current-password"></div>
<button class="btn" id="b" onclick="go()">Connect</button>
<div class="err" id="e">Authentication failed</div>
</div>
</div>
<script>
// === WebGL purple flowing wave shader ===
var canvas=document.getElementById('c'),gl=canvas.getContext('webgl');
var W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;if(gl)gl.viewport(0,0,W,H);}
resize();window.addEventListener('resize',resize);

if(gl){
var vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
var fs=`precision highp float;
uniform float t;
uniform vec2 r;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}

float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}

float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){v+=a*noise(p);p*=2.0;a*=0.5;}
  return v;
}

void main(){
  vec2 uv=gl_FragCoord.xy/r;
  float aspect=r.x/r.y;
  vec2 p=vec2(uv.x*aspect,uv.y);
  
  // Flowing purple bands
  float n=fbm(p*2.0+vec2(t*0.08,t*0.05));
  float wave=sin(p.y*6.0+n*4.0+t*0.3)*0.5+0.5;
  wave*=sin(p.x*3.0+n*3.0-t*0.2)*0.5+0.5;
  
  // Add secondary wave layer
  float n2=fbm(p*3.0-vec2(t*0.06,t*0.1));
  float wave2=sin(p.y*8.0+n2*5.0+t*0.4)*0.5+0.5;
  wave2*=smoothstep(0.0,0.6,uv.y)*smoothstep(1.0,0.3,uv.y);
  
  // Purple color palette
  vec3 col1=vec3(0.12,0.05,0.25); // deep purple
  vec3 col2=vec3(0.45,0.2,0.85);  // bright purple
  vec3 col3=vec3(0.66,0.33,0.97); // light purple
  
  float intensity=wave*0.6+wave2*0.4;
  intensity*=smoothstep(0.0,0.4,uv.y)*smoothstep(1.0,0.5,uv.y);
  intensity=pow(intensity,1.8)*0.7;
  
  vec3 col=mix(col1,col2,intensity);
  col=mix(col,col3,pow(intensity,3.0));
  
  // Dark background blend
  vec3 bg=vec3(0.04,0.03,0.06);
  col=mix(bg,col,smoothstep(0.02,0.15,intensity));
  
  // Subtle vignette
  float vig=1.0-length((uv-0.5)*1.2);
  col*=smoothstep(0.0,0.7,vig);
  
  gl_FragColor=vec4(col,1.0);
}`;

function createShader(src,type){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
var prog=gl.createProgram();
gl.attachShader(prog,createShader(vs,gl.VERTEX_SHADER));
gl.attachShader(prog,createShader(fs,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);gl.useProgram(prog);

var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var pLoc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pLoc);gl.vertexAttribPointer(pLoc,2,gl.FLOAT,false,0,0);

var tLoc=gl.getUniformLocation(prog,'t');
var rLoc=gl.getUniformLocation(prog,'r');

function render(time){
  gl.uniform1f(tLoc,time*0.001);
  gl.uniform2f(rLoc,W,H);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
}

// === Auth ===
var a=sessionStorage.getItem('okx_auth');
if(a){fetch('/api/status',{headers:{'Authorization':a}}).then(function(r){if(r.ok)window.location.replace('/dashboard');});}
document.getElementById('p').onkeydown=function(e){if(e.key==='Enter')go();};
document.getElementById('u').onkeydown=function(e){if(e.key==='Enter')document.getElementById('p').focus();};
function go(){
  var u=document.getElementById('u').value,p=document.getElementById('p').value;
  if(!u||!p)return;
  var b=document.getElementById('b');b.disabled=true;b.textContent='Connecting...';
  var auth='Basic '+btoa(u+':'+p);
  fetch('/api/status',{headers:{'Authorization':auth}}).then(function(r){
    if(r.ok){sessionStorage.setItem('okx_auth',auth);window.location.replace('/dashboard');}
    else{document.getElementById('e').style.display='block';b.disabled=false;b.textContent='Connect';}
  }).catch(function(){document.getElementById('e').style.display='block';b.disabled=false;b.textContent='Connect';});
}
</script>
</body>
</html>
