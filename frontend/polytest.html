<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poly vs OKX Orderbook</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0a18; color: #e0e0e0; font-family: 'Inter', -apple-system, sans-serif; padding: 16px; }
h1 { text-align: center; color: #c084fc; margin-bottom: 4px; font-size: 1.3rem; }
.subtitle { text-align: center; color: #888; margin-bottom: 14px; font-size: 0.8rem; }
.controls { text-align: center; margin-bottom: 14px; display: flex; justify-content: center; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls select { background: #1e1430; color: #e0e0e0; border: 1px solid #3d2a52; border-radius: 6px; padding: 5px 10px; font-size: 0.82rem; }
.status-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 14px; font-size: 0.75rem; }
.status-item { display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
.dot.poll { background: #f59e0b; }
.dot.off { background: #ef4444; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 1100px; margin: 0 auto; }
.panel { background: #1a1028; border-radius: 8px; padding: 12px; border: 1px solid #2d1f42; }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.panel-header h2 { color: #c084fc; font-size: 0.9rem; }
.panel-header .meta { font-size: 0.7rem; color: #666; }
.book { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.78rem; }
.book-head { display: grid; grid-template-columns: 80px 1fr 1fr; padding: 3px 6px; color: #666; font-size: 0.68rem; border-bottom: 1px solid #2d1f42; margin-bottom: 3px; }
.book-head span:nth-child(2), .book-head span:nth-child(3) { text-align: right; }
.row { display: grid; grid-template-columns: 80px 1fr 1fr; padding: 2px 6px; border-radius: 3px; position: relative; line-height: 1.6; }
.row .bar { position: absolute; top: 0; bottom: 0; right: 0; opacity: 0.12; border-radius: 3px; pointer-events: none; }
.row.bid .bar { background: #22c55e; }
.row.ask .bar { background: #ef4444; }
.row .price { font-weight: 600; z-index: 1; }
.row.bid .price { color: #22c55e; }
.row.ask .price { color: #ef4444; }
.row .size, .row .total { text-align: right; z-index: 1; }
.row .total { color: #777; }
.spread-row { text-align: center; padding: 5px; color: #a78bfa; font-weight: 600; font-size: 0.75rem; border: 1px dashed #2d1f42; border-radius: 4px; margin: 3px 0; }
.flash { animation: flash-bg 0.3s ease-out; }
@keyframes flash-bg { 0%{background:rgba(192,132,252,0.15)}100%{background:transparent} }
.empty { text-align: center; padding: 30px; color: #555; }
</style>
</head>
<body>
<h1>Polymarket vs OKX Orderbook</h1>
<div class="subtitle">Live comparison — Poly via WebSocket, OKX via REST poll</div>

<div class="controls">
  <select id="market-select">
    <option value="kr">Korea Republic Win</option>
    <option value="mex">Mexico Win</option>
    <option value="draw">Draw</option>
  </select>
  <select id="depth-select">
    <option value="10">10 levels</option>
    <option value="15" selected>15 levels</option>
    <option value="20">20 levels</option>
  </select>
</div>

<div class="status-bar">
  <div class="status-item"><div class="dot off" id="poly-dot"></div><span id="poly-status">Poly: connecting...</span></div>
  <div class="status-item"><div class="dot off" id="okx-dot"></div><span id="okx-status">OKX: idle</span></div>
  <div class="status-item"><span id="update-count" style="color:#666">0 updates</span></div>
</div>

<div class="container">
  <div class="panel">
    <div class="panel-header">
      <h2>Polymarket</h2>
      <span class="meta" id="poly-meta">-</span>
    </div>
    <div id="poly-book" class="book"><div class="empty">Connecting...</div></div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <h2>OKX Outcomes</h2>
      <span class="meta" id="okx-meta">-</span>
    </div>
    <div id="okx-book" class="book"><div class="empty">Waiting...</div></div>
  </div>
</div>

<script>
const MARKETS = {
  kr: {
    polyYes: '40559900670015709472472801511880289852513956415696043408438494025364180866146',
    polyNo: '82329952143881965276981455380089620795478748889597010389152839311119926936316',
    okxAsset: '101526000',
    label: 'Korea Republic Win (Yes)'
  },
  mex: {
    polyYes: '84622337225923971667543390025202237459542894380445135038857655043890030217262',
    polyNo: '6475664574853487589307000579070420920333411302268516614731603567311278340454',
    okxAsset: '101525000',
    label: 'Mexico Win (Yes)'
  },
  draw: {
    polyYes: '51958120300750633024043231741875227303543295888125840580124643399830654381246',
    polyNo: '113916161974517087375531703144301863196719799992347466230963155791909486342579',
    okxAsset: '101524000',
    label: 'Draw (Yes)'
  }
};

let polyWs = null;
let polyPingTimer = null;
let polyReconnectDelay = 1000;
let okxPollTimer = null;
let polyBook = { bids: [], asks: [] };
let okxBook = { bids: [], asks: [] };
let updateCount = 0;

function getAuth() { return 'Basic ' + btoa('shinori:woshishabi123'); }
function getMarket() { return MARKETS[document.getElementById('market-select').value]; }
function getDepth() { return parseInt(document.getElementById('depth-select').value); }

// ─── Rendering ───

function renderBook(containerId, metaId, bids, asks, depth) {
  const el = document.getElementById(containerId);
  if (!bids.length && !asks.length) { el.innerHTML = '<div class="empty">No data</div>'; return; }

  const topBids = bids.slice(0, depth);
  const topAsks = asks.slice(0, depth);
  const allSizes = [...topBids, ...topAsks].map(r => r.size);
  const maxSize = Math.max(...allSizes, 1);

  let html = '<div class="book-head"><span>Price</span><span>Size</span><span>Total</span></div>';

  // Asks reversed (lowest near spread)
  const displayAsks = topAsks.slice().reverse();
  let askCum = displayAsks.reduce((s, a) => s + a.size, 0);
  for (const a of displayAsks) {
    const pct = (a.size / maxSize * 100).toFixed(0);
    html += `<div class="row ask"><div class="bar" style="width:${pct}%"></div><span class="price">${a.price}</span><span class="size">${fmt(a.size)}</span><span class="total">${fmt(askCum)}</span></div>`;
    askCum -= a.size;
  }

  // Spread
  const bestBid = topBids.length ? parseFloat(topBids[0].price) : 0;
  const bestAsk = topAsks.length ? parseFloat(topAsks[0].price) : 0;
  const spread = bestAsk > 0 && bestBid > 0 ? (bestAsk - bestBid).toFixed(2) : '-';
  const mid = bestAsk > 0 && bestBid > 0 ? ((bestAsk + bestBid) / 2).toFixed(3) : '-';
  html += `<div class="spread-row">Spread ${spread}¢ · Mid ${mid}</div>`;

  // Bids
  let bidCum = 0;
  for (const b of topBids) {
    bidCum += b.size;
    const pct = (b.size / maxSize * 100).toFixed(0);
    html += `<div class="row bid"><div class="bar" style="width:${pct}%"></div><span class="price">${b.price}</span><span class="size">${fmt(b.size)}</span><span class="total">${fmt(bidCum)}</span></div>`;
  }

  el.innerHTML = html;
  document.getElementById(metaId).textContent = `${bids.length}b/${asks.length}a · ${new Date().toLocaleTimeString()}`;
}

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
  if (n >= 10000) return (n/1000).toFixed(1) + 'K';
  if (n >= 1000) return (n/1000).toFixed(2) + 'K';
  return Math.round(n).toLocaleString();
}

function redraw() {
  const depth = getDepth();
  renderBook('poly-book', 'poly-meta', polyBook.bids, polyBook.asks, depth);
  renderBook('okx-book', 'okx-meta', okxBook.bids, okxBook.asks, depth);
  updateCount++;
  document.getElementById('update-count').textContent = `${updateCount} updates`;
}

// ─── Polymarket WebSocket ───

function connectPoly() {
  if (polyPingTimer) { clearInterval(polyPingTimer); polyPingTimer = null; }
  if (polyWs) { polyWs.onclose = null; polyWs.close(); polyWs = null; }
  const market = getMarket();
  const dot = document.getElementById('poly-dot');
  const status = document.getElementById('poly-status');

  dot.className = 'dot off';
  status.textContent = 'Poly: connecting...';

  polyWs = new WebSocket('wss://ws-subscriptions-clob.polymarket.com/ws/market');

  polyWs.onopen = () => {
    const sub = {
      auth: {},
      type: 'subscribe',
      channel: 'market',
      markets: [],
      assets_ids: [market.polyYes]
    };
    polyWs.send(JSON.stringify(sub));
    dot.className = 'dot live';
    status.textContent = 'Poly: live';
    // Keepalive ping every 15s
    if (polyPingTimer) clearInterval(polyPingTimer);
    polyPingTimer = setInterval(() => {
      if (polyWs && polyWs.readyState === WebSocket.OPEN) {
        polyWs.send(JSON.stringify({type: 'ping'}));
      }
    }, 15000);
  };

  polyWs.onmessage = (ev) => {
    polyReconnectDelay = 1000; // reset backoff on successful data
    const data = JSON.parse(ev.data);

    // Initial snapshot (array with full book)
    if (Array.isArray(data)) {
      const snap = data.find(d => d.asset_id === market.polyYes);
      if (snap) {
        polyBook.bids = (snap.bids || []).map(b => ({ price: parseFloat(b.price).toFixed(2), size: parseFloat(b.size) })).sort((a,b) => parseFloat(b.price) - parseFloat(a.price));
        polyBook.asks = (snap.asks || []).map(a => ({ price: parseFloat(a.price).toFixed(2), size: parseFloat(a.size) })).sort((a,b) => parseFloat(a.price) - parseFloat(b.price));
        redraw();
      }
      return;
    }

    // Incremental price_changes
    if (data.price_changes) {
      for (const ch of data.price_changes) {
        if (ch.asset_id !== market.polyYes) continue;
        const price = parseFloat(ch.price).toFixed(2);
        const size = parseFloat(ch.size);
        const side = ch.side === 'BUY' ? 'bids' : 'asks';

        // Update or remove level
        const book = polyBook[side];
        const idx = book.findIndex(l => l.price === price);
        if (size <= 0) {
          if (idx >= 0) book.splice(idx, 1);
        } else {
          if (idx >= 0) book[idx].size = size;
          else book.push({ price, size });
        }

        // Re-sort
        if (side === 'bids') book.sort((a,b) => parseFloat(b.price) - parseFloat(a.price));
        else book.sort((a,b) => parseFloat(a.price) - parseFloat(b.price));
      }
      redraw();
    }
  };

  polyWs.onclose = (ev) => {
    if (polyPingTimer) { clearInterval(polyPingTimer); polyPingTimer = null; }
    dot.className = 'dot off';
    status.textContent = `Poly: reconnecting (${(polyReconnectDelay/1000).toFixed(0)}s)...`;
    setTimeout(() => {
      connectPoly();
      polyReconnectDelay = Math.min(polyReconnectDelay * 1.5, 10000);
    }, polyReconnectDelay);
  };

  polyWs.onerror = () => {};
}

// ─── OKX REST Poll ───

let okxPolling = false;

async function pollOKX() {
  if (okxPolling) return;
  okxPolling = true;
  const market = getMarket();
  const dot = document.getElementById('okx-dot');
  const status = document.getElementById('okx-status');

  try {
    const resp = await fetch(`/api/accounts/e3c629ab/orderbook?asset_id=${market.okxAsset}`, {
      headers: { 'Authorization': getAuth() }
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    okxBook.bids = (data.bids || []).map(b => ({ price: parseFloat(b[0]).toFixed(2), size: parseFloat(b[1]) })).sort((a,b) => parseFloat(b.price) - parseFloat(a.price));
    okxBook.asks = (data.asks || []).map(a => ({ price: parseFloat(a[0]).toFixed(2), size: parseFloat(a[1]) })).sort((a,b) => parseFloat(a.price) - parseFloat(b.price));

    dot.className = 'dot poll';
    status.textContent = 'OKX: polling';
    redraw();
  } catch (e) {
    dot.className = 'dot off';
    status.textContent = `OKX: ${e.message}`;
  }
  okxPolling = false;
}

function startOKXPoll() {
  if (okxPollTimer) clearInterval(okxPollTimer);
  pollOKX();
  okxPollTimer = setInterval(pollOKX, 1000);
}

// ─── Init ───

function init() {
  connectPoly();
  startOKXPoll();
}

document.getElementById('market-select').addEventListener('change', () => {
  polyBook = { bids: [], asks: [] };
  okxBook = { bids: [], asks: [] };
  updateCount = 0;
  init();
});

document.getElementById('depth-select').addEventListener('change', redraw);

init();
</script>
</body>
</html>
